# Builds and tests Holo for Windows (the windows/ folder of this fork).
name: Windows port

on:
  push:
    paths: ["windows/**", ".github/workflows/windows-build.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pyinstaller

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Build Holo.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name Holo --icon holo\assets\holo.ico --add-data "holo\assets;holo\assets" --hidden-import pystray._win32 --collect-data sv_ttk launcher.py

      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Holo.exe -ArgumentList '--self-test', "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Bundle the exe with its license notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\Holo.exe, LICENSE, NOTICE.md, THIRD_PARTY_NOTICES.md release\

      - uses: actions/upload-artifact@v4
        with:
          name: Holo-for-Windows
          path: windows/release/
